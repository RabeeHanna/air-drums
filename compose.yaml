services:
  air-drums:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    init: true
    restart: unless-stopped
  stroke-tests:
    image: node:22-bookworm-slim
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    command: ["node", "--test", "tests-js/stroke-detector.test.mjs", "tests-js/target-predictor.test.mjs", "tests-js/hit-point.test.mjs", "tests-js/hand-points.test.mjs"]
    profiles: ["test"]
